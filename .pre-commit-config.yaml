# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: Go fmt
        entry: bash -c 'out=$(gofmt -l .) && if [ -n "$out" ]; then echo "Unformatted files:$out"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: Golangci lint
        # mirrors golangci/golangci-lint-action in ci.yml
        entry: golangci-lint run ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: Go mod tidy
        entry: bash -c 'go mod tidy && git diff --exit-code -- go.mod go.sum'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: Go build
        entry: make build
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: Go test
        entry: go test -count=1 ./...
        language: system
        types: [go]
        pass_filenames: false
