name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-fmt:
    name: Go fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Unformatted files:$out"
            exit 1
          fi

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2

  go-mod-tidy:
    name: Go mod tidy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Check for drift
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are out of date. Run 'go mod tidy' and commit."
            exit 1
          fi

  go-static:
    name: Go static checks
    runs-on: ubuntu-latest
    needs: [go-fmt, go-vet, go-lint, go-mod-tidy]
    if: always()
    steps:
      - name: All static checks passed
        run: |
          if [[ "${{ needs.go-fmt.result }}" == "failure" || \
                "${{ needs.go-vet.result }}" == "failure" || \
                "${{ needs.go-lint.result }}" == "failure" || \
                "${{ needs.go-mod-tidy.result }}" == "failure" ]]; then
            echo "::error::Static checks failed, skipping build/test"
            exit 1
          fi

  go-build:
    name: Go build
    needs: go-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        run: make build

  go-test:
    name: Go test (${{ matrix.os }})
    needs: go-static
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        if: matrix.os != 'macos-latest'
        run: go test -race -count=1 ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@4ae80bc67b0b2e72a4d091a7b18eb4ecc7db68c8 # v1.3.0

  ci-gate:
    name: CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - go-static
      - go-build
      - go-test
      - codeql
      - conventional-commits
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.go-static.result }}" == "failure" || \
                "${{ needs.go-build.result }}" == "failure" || \
                "${{ needs.go-test.result }}" == "failure" || \
                "${{ needs.codeql.result }}" == "failure" || \
                "${{ needs.conventional-commits.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi